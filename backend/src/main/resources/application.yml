spring:
  application:
    name: plataforma-contenidos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plataforma_contenidos}
    username: ${DB_USER:plataforma_contenidos}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate # el esquema lo gobiernan las migraciones Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Colecciones perezosas (fotos, videos) en lotes de hasta 100 dueños por
        # consulta, no una por ítem: el feed hacía 2 consultas por contenido
        # (N+1) y el backend se saturaba en ~86 peticiones/s (simulación k6,
        # 2026-10-07; FeedIntegrationTest.feedQueryCountDoesNotGrowWithContent).
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:10MB} # primera línea de defensa; app.media.max-file-size-bytes revalida
      max-request-size: ${MEDIA_MAX_FILE_SIZE:10MB}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
      refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  media:
    local-storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:10485760} # 10 MB
    max-dimension-pixels: ${MEDIA_MAX_DIMENSION_PIXELS:6000}
    # Lado más largo con el que se GUARDA (se reduce al subir, ver
    # ImageProcessor). 2560px alcanza para pantallas 2x a todo el ancho;
    # una foto de celular de 4000-6000px pesaba 3-5x más en disco sin que
    # nadie pudiera ver la diferencia.
    max-stored-dimension-pixels: ${MEDIA_MAX_STORED_DIMENSION_PIXELS:2560}
    upload-max-attempts: ${MEDIA_UPLOAD_MAX_ATTEMPTS:30}
    upload-window-minutes: ${MEDIA_UPLOAD_WINDOW_MINUTES:15}

server:
  port: ${SERVER_PORT:8080}
  # Detrás de nginx/Next.js la IP de getRemoteAddr() era siempre la del proxy:
  # con "native", Tomcat toma la IP real de X-Forwarded-For, pero SOLO si el
  # pedido llega desde una red interna (10/8, 172.16/12, 192.168/16, 127/8 —
  # la red de Docker); un X-Forwarded-For mandado desde internet no se cree.
  # Lo usan el límite de intentos de login y la auditoría.
  forward-headers-strategy: native
  error:
    include-message: never # no exponer detalles internos en respuestas de error (OWASP: exposición de información)
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Logs (ISO 27001 A.8.15): cada línea lleva el requestId de su petición
# (RequestIdFilter). En Docker/VPS salen en JSON estructurado (formato ECS,
# variable LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs en docker-compose) para
# poder filtrarlos y buscarlos; en desarrollo, texto legible.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
