spring:
  application:
    name: plataforma-contenidos-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plataforma_contenidos}
    username: ${DB_USER:plataforma_contenidos}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate # el esquema lo gobiernan las migraciones Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never # no exponer detalles internos en respuestas de error (OWASP: exposición de información)
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
