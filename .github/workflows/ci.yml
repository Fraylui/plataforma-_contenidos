name: CI

# CONTEXTO.md sección 26/41.2/41.3: cada PR corre en verde antes de mergear.
# Dos jobs porque el frontend (Server Components) hace fetch al backend
# durante `next build` (SSG/ISR) — no es solo un lint suelto, necesita un
# backend real arriba para poder buildear (ver home/layout/artículo).
# SAST y dependency scanning (sección 27/35.3) quedan para una fase
# posterior, no son parte de este pipeline todavía.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # mvnw pierde el bit ejecutable seguido al pasar por checkouts en
      # Windows — se restaura explícitamente en vez de asumir que el repo
      # lo preserva.
      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      # Testcontainers levanta su propio Postgres/Redis efímero por test
      # (ver src/test/resources/application-test.yml) — no hace falta
      # ningún servicio externo para este job. El runner de GitHub trae
      # Docker preinstalado.
      - name: Test
        working-directory: backend
        run: ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plataforma_contenidos
          POSTGRES_USER: plataforma_contenidos
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plataforma_contenidos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: plataforma_contenidos
      DB_USER: plataforma_contenidos
      DB_PASSWORD: ci_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Solo para que el backend arranque en este job y next build pueda
      # leerlo — no son credenciales reales, no se despliegan a ningún lado.
      JWT_SECRET: ci-only-secret-never-used-outside-this-pipeline-32bytes
      MFA_ENCRYPTION_KEY: "ThTrxueov77AMqUM1Fc/4FMJhFUwrUv7d93NHdHOo/0="
      BACKEND_API_URL: http://localhost:8080
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_BACKEND_ASSET_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      # Empaqueta sin re-correr tests (ya corrieron en el job "backend"):
      # este job solo necesita un jar arrancable para que next build tenga
      # datos reales contra los cuales generar las páginas estáticas.
      - name: Package backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar target/*.jar > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          echo "Backend no respondió a tiempo"; cat backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
